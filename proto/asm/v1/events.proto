syntax = "proto3";

package asm.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/thapr0digy/portwarden/gen/asm/v1;asmv1";

enum Kind {
  KIND_UNSPECIFIED = 0;
  OPENED = 1;
  CLOSED = 2;
  OWNER_CHANGED = 3;
}

enum Source {
  SOURCE_UNSPECIFIED = 0;
  EBPF = 1;
  BASELINE = 2;
  RECONCILE = 3;
}

message Listener {
  uint32 netns = 1;
  string proto = 2;
  string addr = 3;
  uint32 port = 4;
  string key = 5;
}

message Container {
  string runtime = 1;
  string id = 2;
}

message Process {
  uint32 pid = 1;
  uint32 uid = 2;
  string comm = 3;
  string exe = 4;
  repeated string cmdline = 5;
  string sha256 = 6;
  string unit = 7;
  string socket_unit = 8;
  Container container = 9;
  uint64 cgroup_id = 10;
}

message ListenerEvent {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp observed_at = 5;
  Kind kind = 6;
  Source source = 7;
  Listener listener = 8;
  repeated Process processes = 9;
  // Set only on OWNER_CHANGED: the owners before the change.
  repeated Process previous_processes = 10;
  // The listener's exposure when the event was published (on CLOSED: its last one).
  Exposure exposure = 11;
  // The host's public-IP candidates and cloud identity at publish time.
  HostInfo host = 12;
  // The proxy routes that end at this listener (it is their backend), at publish time.
  repeated ProxyRef behind_proxy = 13;
  // Run ordering (M5 fix wave): the kernel boot id and a run counter the agent keeps in
  // its spool directory (0 when it has none). Consumers order runs of one host by
  // (boot_id, run_number) instead of the run_id's wall-clock time.
  string boot_id = 14;
  uint64 run_number = 15;
}

message ListenerState {
  Listener listener = 1;
  repeated Process processes = 2;
  Exposure exposure = 3;
  repeated ProxyRef behind_proxy = 4;
}

message Snapshot {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp taken_at = 5;
  repeated ListenerState listeners = 6;
  HostInfo host = 7;
  // Every known proxy with its full route set.
  repeated ProxyState proxies = 8;
  // Run ordering (M5 fix wave): the kernel boot id and a run counter the agent keeps in
  // its spool directory (0 when it has none). Consumers order runs of one host by
  // (boot_id, run_number) instead of the run_id's wall-clock time.
  string boot_id = 9;
  uint64 run_number = 10;
}

message Heartbeat {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp at = 5;
  uint64 ringbuf_drops = 6;
  uint64 queue_drops = 7;
  uint64 dropped_foreign_netns = 8 [deprecated = true];
  // Run ordering (M5 fix wave): the kernel boot id and a run counter the agent keeps in
  // its spool directory (0 when it has none). Consumers order runs of one host by
  // (boot_id, run_number) instead of the run_id's wall-clock time.
  string boot_id = 9;
  uint64 run_number = 10;
  // The agent's tamper checks as of its last pass (M6); unset from agents without them.
  TamperStatus tamper = 11;
  // The firewall fingerprint as of the agent's latest exposure view (M7), the same value
  // as HostInfo.firewall_fingerprint. Unset from agents without it.
  optional string firewall_fingerprint = 12;
}

// TamperFlag is one tamper signal the agent's self-checks (design §9) currently see.
message TamperFlag {
  // probe_detached, program_replaced, map_replaced, ptraced, binary_replaced,
  // binary_missing, unit_changed, counter_reset, events_dropped.
  string kind = 1;
  // What it is about: a program name (on_listen), a file path, a counter name, "self".
  string subject = 2;
  // e.g. "link 12 now runs program 99 (tag 0a1b...), loaded 41 (tag 9f8e...)".
  string detail = 3;
  // When the agent first saw it (this run).
  google.protobuf.Timestamp since = 4;
  // What was observed (a file's new hash, a tracer's pid, a link's program id): a new
  // fingerprint for the same kind and subject is a new flag (M6 fix wave).
  string fingerprint = 5;
  // Informational: reported, never paged (an upgrade by the package, drops below the
  // agent's --tamper-drop-rate).
  bool info = 6;
}

// TamperStatus is the result of the agent's last tamper pass.
message TamperStatus {
  // Every flag currently raised; empty when all checks pass.
  repeated TamperFlag flags = 1;
  google.protobuf.Timestamp checked_at = 2;
  // The checks that ran, e.g. "probes", "self_exe", "unit", "ptrace", "counters".
  repeated string checks = 3;
  // Checks that could not read their evidence this pass ("unit: no systemd unit"); never
  // a tamper signal by themselves.
  repeated string unknown = 4;
  // Per-program run counts, only while kernel.bpf_stats_enabled is 1.
  map<string, uint64> prog_run_counts = 5;
  uint64 ringbuf_drops = 6;
}

// TamperEvent is published on asm.<host>.tamper whenever a flag is raised or cleared.
message TamperEvent {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp observed_at = 5;
  TamperStatus status = 6;
  repeated TamperFlag raised = 7;
  repeated TamperFlag cleared = 8;
  string boot_id = 9;
  uint64 run_number = 10;
}

// ExposureLevel is the design's exposure level plus one (0 is unset): it only rises as
// evidence comes in. The agent sets LOCAL, BOUND and HOST_FIREWALL_OPEN; CLOUD_OPEN and
// CONFIRMED are reserved for the backend's cloud look-up and the outside checker.
enum ExposureLevel {
  EXPOSURE_LEVEL_UNSPECIFIED = 0;
  // Level 0: loopback, or a container listener no host port mapping points at.
  EXPOSURE_LOCAL = 1;
  // Level 1: bound to all addresses or to a real interface address.
  EXPOSURE_BOUND = 2;
  // Level 2: the host firewall (nftables / iptables) lets a packet from 0/0 in.
  EXPOSURE_HOST_FIREWALL_OPEN = 3;
  // Level 3 (reserved): a cloud security group or load balancer allows it.
  EXPOSURE_CLOUD_OPEN = 4;
  // Level 4 (reserved): the outside checker connected.
  EXPOSURE_CONFIRMED = 5;
}

message Exposure {
  ExposureLevel level = 1;
  // Why, in order: the bind ("bind:any"), any port mapping, then the firewall verdict
  // ("nft: accept tcp/8443 from 0/0 (eth0, inet filter input)").
  repeated string evidence = 2;
}

// PublicIP is one candidate for the server's public address.
message PublicIP {
  string ip = 1;
  // netlink (an interface address), imds (cloud metadata) or ingest-local (the local
  // address of the agent's NATS connection, only when it is public).
  string via = 2;
  // in (people can connect to it) or out (the server connects out from it).
  string dir = 3;
  // The interface, for via=netlink.
  string iface = 4;
}

message HostInfo {
  repeated PublicIP public_ips = 1;
  // aws, gcp or azure when cloud metadata answered; empty otherwise.
  string cloud = 2;
  string instance_id = 3;
  // Host-level problems that weaken the agent's judgements, e.g.
  // "fw:unreadable iptables-save: Permission denied" while the firewall cannot be read in
  // full (listeners then keep their last known level). Empty when all is read.
  repeated string conditions = 4;
  // The cloud region (AWS placement/region, the GCP zone's region, the Azure location);
  // the backend's cloud look-up needs it. Empty off-cloud.
  string region = 5;
  // A digest of the firewall ruleset the agent judges with (M7): lowercase hex SHA-256 of
  // the parsed rules (counters and dump timestamps excluded), never the rules themselves.
  // It changes whenever a rule does, even one that moves no listener's exposure. Set and
  // empty while the firewall cannot be read in full (a "fw:unreadable" condition says
  // why); unset from agents without it.
  optional string firewall_fingerprint = 6;
  // The instance's full name in its cloud (M10), for the backend's GCP and Azure look-ups:
  // GCP "projects/<project>/zones/<zone>/instances/<id>", Azure the VM's resource id
  // ("/subscriptions/<id>/resourceGroups/<group>/providers/Microsoft.Compute/virtualMachines/<name>").
  // Empty on AWS (instance_id and region suffice), off-cloud, and from older agents.
  string cloud_resource = 7;
}

// ExposureEvent is published on asm.<host>.exposure.changed when a listener's level
// changes, and once when a listener opens (previous unset).
message ExposureEvent {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp observed_at = 5;
  Listener listener = 6;
  repeated Process processes = 7;
  Exposure exposure = 8;
  Exposure previous = 9;
  // What made the agent re-judge: opened, listener (a listener change, e.g. a port
  // mapping's proxy appeared), firewall, interfaces, recheck.
  string trigger = 10;
  HostInfo host = 11;
  // Who published it: "" for the host's agent; "cloud" for the backend's cloud look-up
  // (level 3, on pwb.cloud.<host>.exposure). Informational only: consumers take the
  // origin from the subject, and drop an asm.* event whose origin is set. Backend events
  // are not part of the host's sequence: their run_id is the service's and seq is 0.
  string origin = 12;
  // Run ordering (M5 fix wave): the kernel boot id and a run counter the agent keeps in
  // its spool directory (0 when it has none). Consumers order runs of one host by
  // (boot_id, run_number) instead of the run_id's wall-clock time.
  string boot_id = 13;
  uint64 run_number = 14;
}

// ExposureConfirmation is published by the outside checker (portwarden-verifier) on
// pwb.verifier.<host>.exposure after it probed a listener from outside the server.
message ExposureConfirmation {
  string event_id = 1;
  string host_id = 2;
  // The verifier's run; seq is always 0 (not part of the host's sequence).
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp observed_at = 5;
  Listener listener = 6;
  // confirmed: the probe connected (TCP) or got an answer (UDP). unreachable: refused,
  // timed out (TCP), or an ICMP port unreachable (UDP). no_response: UDP silence, which
  // means open or filtered, never closed.
  string result = 7;
  // The address and port probed, e.g. "203.0.113.7:443" or "[2001:db8::1]:53".
  string target = 8;
  // tcp-connect, http-head, dns, ntp, snmp, memcached, udp.
  string probe = 9;
  // What the service sent first (at most 256 bytes, non-printable bytes escaped).
  string banner = 10;
  // e.g. "connect: connection refused", "no answer within 3s".
  string detail = 11;
  uint32 rtt_ms = 12;
  // The checker's identity (its configured name, e.g. "portwarden-verifier@probe-1").
  string checker = 13;
  // Set when result is confirmed: level CONFIRMED with the evidence.
  Exposure exposure = 14;
  // Always "verifier".
  string origin = 15;
}

// HostEvent is published on asm.<host>.host.changed when the public-IP candidates or the
// cloud identity change.
message HostEvent {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp observed_at = 5;
  HostInfo host = 6;
  HostInfo previous = 7;
  // Run ordering (M5 fix wave): the kernel boot id and a run counter the agent keeps in
  // its spool directory (0 when it has none). Consumers order runs of one host by
  // (boot_id, run_number) instead of the run_id's wall-clock time.
  string boot_id = 8;
  uint64 run_number = 9;
}

// Proxy is a reverse proxy instance (nginx, Apache, HAProxy, or an observed-only kind).
message Proxy {
  // Stable across reloads and restarts: <kind>/<netns>/<config path or exe>.
  string id = 1;
  // nginx, apache, haproxy, caddy, envoy, traefik.
  string kind = 2;
  // The master (the root of the proxy's process tree) first, then the other holders.
  repeated Process processes = 3;
  // The proxy's own listeners.
  repeated Listener listeners = 4;
  // The main configuration file ("" for observed-only kinds).
  string config_path = 5;
  // Every configuration file read, in include order.
  repeated string config_files = 6;
  // What could not be read or followed, e.g. "unreadable /etc/nginx/x.conf: permission denied".
  repeated string notes = 7;
  // How many processes the proxy has; processes lists the master and at most 15 others.
  uint32 process_count = 8;
}

// ProxyBackend is one place a route sends traffic to.
message ProxyBackend {
  // As written in the config ("127.0.0.1:8000", "unix:/run/php/php-fpm.sock", "app:8000",
  // "$backend"), or the observed destination of an inferred backend.
  string address = 1;
  // The resolved destination (empty when unresolved or a Unix socket).
  string ip = 2;
  uint32 port = 3;
  // The Unix socket path, for a Unix-socket backend.
  string unix_path = 4;
  // The listener this backend ends at, and its holders, when one matches.
  Listener listener = 5;
  repeated Process processes = 6;
  // config: named in the configuration. seen: the proxy connected to it (observed
  // connections). A backend seen but not configured is inferred.
  bool config = 7;
  bool seen = 8;
  uint64 connections = 9;
  google.protobuf.Timestamp last_seen = 10;
  // Why it is not resolved or joined, e.g. "unresolved: variable $host", "no listener".
  string note = 11;
}

// ProxyRoute is one routing rule: frontend (listen, names, path) to backends.
message ProxyRoute {
  // Listen addresses as configured, normalised ("0.0.0.0:443", "[::]:443", "*:80").
  repeated string listen = 1;
  // The proxy's listeners this route is served on.
  repeated Listener frontends = 2;
  repeated string server_names = 3;
  // location / ProxyPass path / HAProxy use_backend condition.
  string path = 4;
  // proxy, fastcgi, uwsgi, scgi, grpc, memcached, static, return.
  string kind = 5;
  // The target as written (proxy_pass argument, ProxyPass URL, backend name).
  string target = 6;
  // The upstream / balancer / HAProxy backend name, when the target names one.
  string upstream = 7;
  // The document root, for static routes.
  string root = 8;
  // file:line of the directive.
  string source = 9;
  // true when the route comes from observed connections only (not in the config).
  bool inferred = 10;
  repeated string notes = 11;
  repeated ProxyBackend backends = 12;
}

// ProxyState is a proxy as carried in snapshots: its routes are not repeated there (a
// snapshot must stay small); route_count and routes_digest identify its current route
// set, which follows the snapshot as a proxy.routes event (trigger=snapshot).
message ProxyState {
  Proxy proxy = 1;
  // Unused in snapshots since the M4 fix wave (always empty).
  repeated ProxyRoute routes = 2;
  uint32 route_count = 3;
  // Hex SHA-256 (first 16 bytes) of the deterministic encoding of the routes.
  string routes_digest = 4;
  bool truncated = 5;
}

// ProxyRoutes is published on asm.<host>.proxy.routes with a proxy's full route set
// whenever it changes (config, reload, restart, a backend listener, newly seen traffic),
// and with removed=true when the proxy is gone.
message ProxyRoutes {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp observed_at = 5;
  Proxy proxy = 6;
  repeated ProxyRoute routes = 7;
  // started, config, listener, traffic, recheck, stopped.
  string trigger = 8;
  bool removed = 9;
  HostInfo host = 10;
  // The route set was cut to stay under the size limits (500 routes, half the server's
  // max_payload): routes holds the first ones in order, total_routes how many there are.
  bool truncated = 11;
  uint32 total_routes = 12;
  // Run ordering (M5 fix wave): the kernel boot id and a run counter the agent keeps in
  // its spool directory (0 when it has none). Consumers order runs of one host by
  // (boot_id, run_number) instead of the run_id's wall-clock time.
  string boot_id = 13;
  uint64 run_number = 14;
}

// ProxyRef names a proxy route that ends at a listener (on the backend's events).
message ProxyRef {
  string proxy_id = 1;
  string kind = 2;
  // The proxy's master process.
  Process proxy = 3;
  repeated Listener frontends = 4;
  repeated string server_names = 5;
  string path = 6;
  bool config = 7;
  bool seen = 8;
}

// ProbeRequest is published by the inventory on pwb.probe.<host>.request: probe this
// listener on these candidate addresses. The candidates come from the inventory's stored
// state (the listener's bind address and the host block it holds), never from the event
// that triggered the request; the verifier still filters them by its allowlist (and,
// for private addresses, by its own per-host list).
message ProbeRequest {
  string event_id = 1;
  string host_id = 2;
  google.protobuf.Timestamp requested_at = 3;
  Listener listener = 4;
  // The listener's effective level (proto numbering).
  ExposureLevel level = 5;
  // Candidate addresses (at most 4) and ports (at most 4; a mapped container listener's
  // host ports).
  repeated string addresses = 6;
  repeated uint32 ports = 7;
  string proto = 8;
  // exposure (a level change), cloud (a cloud verdict) or reprobe (periodic).
  string reason = 9;
}

// HostForgotten is published by the inventory on pwb.inventory.<host>.forgotten when an
// operator forgets a host (M8: a decommissioned server). Consumers drop the host's state
// and skip every message of the host stored in the stream before this one (by stream
// sequence); a later message from the host makes it a new host.
message HostForgotten {
  string event_id = 1;
  string host_id = 2;
  google.protobuf.Timestamp at = 3;
}
