# Example drop-in for portwarden-agent.service, NOT active: the .deb ships it under
# /usr/share/doc/portwarden-agent/examples/ only. It adds CAP_NET_RAW, which
# iptables-legacy-save needs (it opens a raw socket) to read an iptables-legacy ruleset.
# Hosts on the nf_tables backend (Ubuntu 24.04 and later by default) do not need it;
# without it the legacy tables appear in the firewall read notes and are left out.
#
# Cost: the agent (and the nft/iptables-save children that inherit its ambient set) can
# then open raw IP sockets: a compromised agent could sniff or forge IP packets.
#
# Install, then restart (the agent's unit check reports unit_changed for the new drop-in
# until the restart, which is how a deliberate unit change is accepted):
#   sudo install -D -m 0644 /usr/share/doc/portwarden-agent/examples/iptables-legacy.conf \
#     /etc/systemd/system/portwarden-agent.service.d/iptables-legacy.conf
#   sudo systemctl daemon-reload && sudo systemctl restart portwarden-agent
# Both directives add to the unit's lists (they do not replace them).
[Service]
AmbientCapabilities=CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_RAW
