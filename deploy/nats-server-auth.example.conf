# Least-privilege NATS auth for Portwarden with nkey users (design §6: each server may
# publish only under its own asm.<host> prefix). JetStream on, everything in the global
# account. Mint the users and render their permissions with portwarden-natsauth:
#
#   portwarden-natsauth mint --dir /etc/portwarden/nats-users --role admin
#   portwarden-natsauth mint --dir /etc/portwarden/nats-users --role host --host "$(cat /etc/machine-id)"   # per server
#   portwarden-natsauth mint --dir /etc/portwarden/nats-users --role inventory
#   portwarden-natsauth mint --dir /etc/portwarden/nats-users --role alerter
#   portwarden-natsauth mint --dir /etc/portwarden/nats-users --role verifier
#   portwarden-natsauth render --dir /etc/portwarden/nats-users --out /etc/nats/portwarden-users.conf
#   systemctl reload nats-server
#
# Each <name>.nk is that user's seed: copy it to the host (agent --nats-nkey) or service
# (config nats.nkey_file) and keep it 0600. The server only ever sees public keys.
#
# What each role may do (internal/natsauth):
#   host-<id>  publish asm.<id>.>; subscribe _INBOX_<id>.> (its JetStream acks). It cannot
#              look up, create or change the stream: the admin creates it first.
#   inventory  its durable consumer pw-inventory; fetch single stream messages (gap reload);
#              publish asm.*.exposure.changed (cloud look-up, origin=cloud); _INBOX_inventory.>
#   alerter    its durable consumers pw-alerter, pw-alerter-hb; _INBOX_alerter.>; publishes nothing
#   verifier   its durable consumer pw-verifier; publish asm.*.exposure.confirmed; _INBOX_verifier.>
#   admin      $JS.API.> (stream management: can purge or delete ASM_EVENTS) — never give it to a host.
# Never grant "_INBOX.>" to a host or service: JetStream consumers receive payloads on
# _INBOX.<id>, so it would let one user read another's deliveries.
listen: 0.0.0.0:4222
tls {
  cert_file: "/etc/nats/server.pem"
  key_file: "/etc/nats/server-key.pem"
}
jetstream { store_dir: "/var/lib/nats" }
include "portwarden-users.conf"

# Create the stream once, as admin (the agent never changes an existing stream):
#   nats --nkey /etc/portwarden/nats-users/admin.nk stream add ASM_EVENTS \
#     --subjects 'asm.>' --storage file --retention limits --max-age 168h \
#     --dupe-window 2m --replicas 1 --allow-direct --defaults
