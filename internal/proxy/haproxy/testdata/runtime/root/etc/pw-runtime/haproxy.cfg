# Hand-written: the runtime API case. dev/proxy-fixtures.sh starts this config, changes
# it over the stats socket (set server addr, add server, disable server) and records
# "show servers state" in servers-state.txt; runtime-routes.txt is the overlay.
global
	stats socket /tmp/pw-runtime-admin.sock mode 600 level admin
	stats socket ipv4@127.0.0.1:7999 level operator

defaults
	mode http
	timeout connect 1s
	timeout client 5s
	timeout server 5s

frontend web
	bind 127.0.0.1:7480
	default_backend app

backend app
	server s1 127.0.0.1:7001
	server s2 127.0.0.1:7002
	server gone 127.0.0.1:7003
	server-template web 2 127.0.0.1:7100
