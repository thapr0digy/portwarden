# Portwarden agent as a Kubernetes DaemonSet: one agent per node, in the node's PID and
# network namespaces (it must see every process and listening socket), with exactly the
# four capabilities the systemd unit grants (design §9) and a read-only root filesystem.
#
#   portwarden-natsauth mint --dir users --role host --host <machine-id>   # once per node
#   kubectl apply -f deploy/kubernetes/daemonset.yaml   # creates the namespace too
#   kubectl -n portwarden create secret generic portwarden-agent-nats \
#     --from-file=users/host-<id1>.nk --from-file=users/host-<id2>.nk ...
#
# Per-node credentials: the Secret holds one seed per node, named host-<machine-id>.nk,
# and each agent (--nats-nkey-dir) uses its own node's, so a node can still publish only
# under its own asm.<host> prefix. A node without its seed fails to start (a crash-looping
# pod), and an agent whose publishes NATS refuses exits: nothing is dropped silently.
# The namespace needs the "privileged" Pod Security level (hostPID, hostNetwork, hostPath
# and added capabilities are refused under "baseline").
#
# The image is built from deploy/Dockerfile. The Helm chart (deploy/helm/portwarden-agent)
# renders the same objects with values.
apiVersion: v1
kind: Namespace
metadata:
  name: portwarden
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portwarden-agent
  namespace: portwarden
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: portwarden-agent
  namespace: portwarden
  labels:
    app.kubernetes.io/name: portwarden-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: portwarden-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portwarden-agent
    spec:
      serviceAccountName: portwarden-agent
      automountServiceAccountToken: false
      # The node's PID and network namespaces: listeners, their processes and the firewall.
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Early on every node, before most workloads.
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 10
      containers:
        - name: agent
          image: ghcr.io/thapr0digy/portwarden-agent:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --nats-url=tls://nats.example:4222
            - --nats-nkey-dir=/etc/portwarden/nats
            - --spool-dir=/var/lib/portwarden/spool
            - --machine-id-path=/etc/machine-id
          securityContext:
            # Root with only these four capabilities (non-root users get no effective
            # capabilities from a pod spec). NoNewPrivileges via allowPrivilegeEscalation.
            runAsUser: 0
            runAsNonRoot: false
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "PERFMON", "SYS_PTRACE", "NET_ADMIN"]
            seccompProfile:
              # containerd's and Docker's default profiles allow bpf() with CAP_BPF and
              # perf_event_open() with CAP_PERFMON. An older runtime that gates them on
              # CAP_SYS_ADMIN fails the agent's start with EPERM: use Unconfined there.
              type: RuntimeDefault
            appArmorProfile:
              # The runtime's default AppArmor profile only lets a container ptrace-read
              # its own peers, which would hide every host process's /proc/<pid>/exe and
              # fd links from the agent.
              type: Unconfined
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
            - name: spool
              mountPath: /var/lib/portwarden
            - name: tmp
              mountPath: /tmp
            - name: nats
              mountPath: /etc/portwarden/nats
              readOnly: true
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        - name: dbus
          hostPath:
            path: /run/dbus
            type: DirectoryOrCreate
        - name: spool
          hostPath:
            # Not /var/lib/portwarden: that is the .deb's StateDirectory, and a node with
            # both (a migration) must not have two agents share one spool.
            path: /var/lib/portwarden-k8s
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nats
          secret:
            secretName: portwarden-agent-nats
            defaultMode: 0400
