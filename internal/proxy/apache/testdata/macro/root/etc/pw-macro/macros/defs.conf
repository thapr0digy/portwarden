<Macro Backend $path $hostport>
	ProxyPass $path http://$hostport/
	ProxyPassReverse $path http://$hostport/
</Macro>

<Macro AppHost $name $nameport $port>
<VirtualHost *:80>
	ServerName $name
	ServerAlias www.$name
	Use Backend / 127.0.0.1:$port
	Use Backend /admin 127.0.0.1:$nameport
</VirtualHost>
</Macro>

<Macro Gone $x>
	ProxyPass /gone http://127.0.0.1:$x/
</Macro>
