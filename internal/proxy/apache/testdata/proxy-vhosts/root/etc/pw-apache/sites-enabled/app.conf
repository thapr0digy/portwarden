<VirtualHost *:80>
	ServerName app.example.com
	ServerAlias www.app.example.com
	DocumentRoot /var/www/app

	ProxyPreserveHost On
	ProxyPass /static !
	ProxyPass / http://127.0.0.1:8000/ retry=0
	ProxyPassReverse / http://127.0.0.1:8000/

	<Location /api>
		ProxyPass http://127.0.0.1:9000/
	</Location>

	ProxyPassMatch "^/(.*\.php)$" "fcgi://127.0.0.1:9001/var/www/app/$1"

	RewriteEngine On
	RewriteRule "^/old/(.*)$" "http://127.0.0.1:8080/$1" [P,L]
	RewriteRule "^/moved$" "/new" [R=301,L]

	<Proxy "balancer://cluster">
		BalancerMember "http://127.0.0.1:8001"
		BalancerMember "http://127.0.0.1:8002" status=+H
	</Proxy>
	ProxyPass /bal balancer://cluster/
	ProxyPass /ws ws://127.0.0.1:8090/
	ProxyPass /def http://${BACKEND}/
	ProxyPass /sock "unix:/run/app.sock|http://localhost/"

	<FilesMatch "\.php$">
		SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
	</FilesMatch>

	<IfModule mod_nonexistent.c>
		ProxyPass /never http://127.0.0.1:9999/
	</IfModule>
	<IfDefine NOT_DEFINED>
		ProxyPass /never2 http://127.0.0.1:9998/
	</IfDefine>
	<IfDefine !NOT_DEFINED>
		ProxyPass /yes http://127.0.0.1:9997/
	</IfDefine>

	Include snippets/extra.conf
</VirtualHost>

<VirtualHost 127.0.0.1:8081 [::1]:8082>
	ServerName internal.local
	ProxyPass / http://localhost:7000/ \
		retry=5
</VirtualHost>
