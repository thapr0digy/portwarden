# Minimal NATS server for Listener Watch: JetStream on, loopback only.
listen: 127.0.0.1:4222
jetstream {
  store_dir: "/var/lib/nats"
}

# For per-host users limited to publishing asm.<host>.> and subscribing to their own
# _INBOX_<host>.> replies, see nats-server-auth.example.conf. (Do not grant "$JS.API.>"
# or "_INBOX.>" to hosts: the first is admin-level, the second exposes every consumer's
# deliveries.)
