syntax = "proto3";

package asm.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/thapr0digy/portwarden/gen/asm/v1;asmv1";

enum Kind {
  KIND_UNSPECIFIED = 0;
  OPENED = 1;
  CLOSED = 2;
  OWNER_CHANGED = 3;
}

enum Source {
  SOURCE_UNSPECIFIED = 0;
  EBPF = 1;
  BASELINE = 2;
  RECONCILE = 3;
}

message Listener {
  uint32 netns = 1;
  string proto = 2;
  string addr = 3;
  uint32 port = 4;
  string key = 5;
}

message Container {
  string runtime = 1;
  string id = 2;
}

message Process {
  uint32 pid = 1;
  uint32 uid = 2;
  string comm = 3;
  string exe = 4;
  repeated string cmdline = 5;
  string sha256 = 6;
  string unit = 7;
  string socket_unit = 8;
  Container container = 9;
  uint64 cgroup_id = 10;
}

message ListenerEvent {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp observed_at = 5;
  Kind kind = 6;
  Source source = 7;
  Listener listener = 8;
  repeated Process processes = 9;
  // Set only on OWNER_CHANGED: the owners before the change.
  repeated Process previous_processes = 10;
  // The listener's exposure when the event was published (on CLOSED: its last one).
  Exposure exposure = 11;
  // The host's public-IP candidates and cloud identity at publish time.
  HostInfo host = 12;
}

message ListenerState {
  Listener listener = 1;
  repeated Process processes = 2;
  Exposure exposure = 3;
}

message Snapshot {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp taken_at = 5;
  repeated ListenerState listeners = 6;
  HostInfo host = 7;
}

message Heartbeat {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp at = 5;
  uint64 ringbuf_drops = 6;
  uint64 queue_drops = 7;
  uint64 dropped_foreign_netns = 8 [deprecated = true];
}

// ExposureLevel is the design's exposure level plus one (0 is unset): it only rises as
// evidence comes in. The agent sets LOCAL, BOUND and HOST_FIREWALL_OPEN; CLOUD_OPEN and
// CONFIRMED are reserved for the backend's cloud look-up and the outside checker.
enum ExposureLevel {
  EXPOSURE_LEVEL_UNSPECIFIED = 0;
  // Level 0: loopback, or a container listener no host port mapping points at.
  EXPOSURE_LOCAL = 1;
  // Level 1: bound to all addresses or to a real interface address.
  EXPOSURE_BOUND = 2;
  // Level 2: the host firewall (nftables / iptables) lets a packet from 0/0 in.
  EXPOSURE_HOST_FIREWALL_OPEN = 3;
  // Level 3 (reserved): a cloud security group or load balancer allows it.
  EXPOSURE_CLOUD_OPEN = 4;
  // Level 4 (reserved): the outside checker connected.
  EXPOSURE_CONFIRMED = 5;
}

message Exposure {
  ExposureLevel level = 1;
  // Why, in order: the bind ("bind:any"), any port mapping, then the firewall verdict
  // ("nft: accept tcp/8443 from 0/0 (eth0, inet filter input)").
  repeated string evidence = 2;
}

// PublicIP is one candidate for the server's public address.
message PublicIP {
  string ip = 1;
  // netlink (an interface address), imds (cloud metadata) or ingest-local (the local
  // address of the agent's NATS connection, only when it is public).
  string via = 2;
  // in (people can connect to it) or out (the server connects out from it).
  string dir = 3;
  // The interface, for via=netlink.
  string iface = 4;
}

message HostInfo {
  repeated PublicIP public_ips = 1;
  // aws, gcp or azure when cloud metadata answered; empty otherwise.
  string cloud = 2;
  string instance_id = 3;
  // Host-level problems that weaken the agent's judgements, e.g.
  // "fw:unreadable iptables-save: Permission denied" while the firewall cannot be read in
  // full (listeners then keep their last known level). Empty when all is read.
  repeated string conditions = 4;
}

// ExposureEvent is published on asm.<host>.exposure.changed when a listener's level
// changes, and once when a listener opens (previous unset).
message ExposureEvent {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp observed_at = 5;
  Listener listener = 6;
  repeated Process processes = 7;
  Exposure exposure = 8;
  Exposure previous = 9;
  // What made the agent re-judge: opened, listener (a listener change, e.g. a port
  // mapping's proxy appeared), firewall, interfaces, recheck.
  string trigger = 10;
  HostInfo host = 11;
}

// HostEvent is published on asm.<host>.host.changed when the public-IP candidates or the
// cloud identity change.
message HostEvent {
  string event_id = 1;
  string host_id = 2;
  string run_id = 3;
  uint64 seq = 4;
  google.protobuf.Timestamp observed_at = 5;
  HostInfo host = 6;
  HostInfo previous = 7;
}
