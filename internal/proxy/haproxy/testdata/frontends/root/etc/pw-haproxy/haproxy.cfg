# Hand-written: frontends with ACL-routed use_backend rules, a dynamic use_backend, a
# default_backend inherited from defaults, TCP mode, Unix-socket servers, servers
# without a port, a server-template on a host name and listen sections.
global
	log /dev/log local0
	stats socket /run/haproxy/pw-admin.sock mode 660 level admin

defaults
	mode http
	timeout connect 5s
	timeout client 30s
	timeout server 30s
	default_backend fallback

frontend web
	bind *:80
	bind :::8443 v4v6
	bind 127.0.0.1:8080,127.0.0.1:8081
	acl is_api path_beg /api
	acl is_static hdr(host) -i static.example.com
	use_backend api if is_api
	use_backend static_be if is_static !is_api
	use_backend %[req.hdr(host),lower,map(/etc/pw-haproxy/hosts.map,web_be)]
	default_backend web_be

frontend tcp_in
	mode tcp
	bind 0.0.0.0:5432
	default_backend pg

frontend inherits
	bind 127.0.0.1:8090

backend api
	balance roundrobin
	server api1 127.0.0.1:9000 check
	server api2 127.0.0.1:9001 check backup
	server api3 [::1]:9002

backend static_be
	server s1 unix@/run/static.sock
	server s2 /run/static2.sock

backend web_be
	default-server inter 3s
	server w1 localhost:8000
	server w2 127.0.0.1

backend pg
	mode tcp
	server pg1 ipv4@127.0.0.1:5433

backend fallback
	server-template srv 3 app.internal:8080 check init-addr none

listen stats
	bind 127.0.0.1:8404
	stats enable
	stats uri /stats

listen mysql
	bind :3307
	mode tcp
	server db1 127.0.0.1:3306
