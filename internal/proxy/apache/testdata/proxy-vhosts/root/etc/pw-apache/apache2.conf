# Hand-written: name-based virtual hosts with every proxy construct the parser reads
# (ProxyPass in and out of <Location>, exclusions, ProxyPassMatch, RewriteRule [P],
# balancers, SetHandler to PHP-FPM, Unix sockets, Define variables, IfModule/IfDefine,
# an Include inside a virtual host) and a main-server ProxyPass.
ServerRoot "/etc/pw-apache"
Define BACKEND 127.0.0.1:8070
Mutex file:${APACHE_LOCK_DIR} default
PidFile ${APACHE_PID_FILE}
User ${APACHE_RUN_USER}
Group ${APACHE_RUN_GROUP}
ErrorLog ${APACHE_LOG_DIR}/error.log
LogLevel warn
ServerName main.local

IncludeOptional mods-enabled/*.load
Include ports.conf

<IfModule mod_proxy.c>
	ProxyRequests Off
	# Main-server ProxyPass: every virtual host inherits it.
	ProxyPass /global http://127.0.0.1:6000/
</IfModule>

IncludeOptional conf-enabled/*.conf
IncludeOptional sites-enabled/*.conf
