# Hand-written: mod_macro. Macros defined in one file and used in another, a macro
# producing a whole virtual host, a macro used inside a virtual host, a macro using
# another, the longest parameter replaced first, a quoted argument, UndefMacro.
ServerRoot "/etc/pw-macro"
Mutex file:${APACHE_LOCK_DIR} default
PidFile ${APACHE_PID_FILE}
User ${APACHE_RUN_USER}
Group ${APACHE_RUN_GROUP}
ErrorLog ${APACHE_LOG_DIR}/error.log
LogLevel warn
ServerName main.local

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule macro_module /usr/lib/apache2/modules/mod_macro.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so

Listen 80
Listen 127.0.0.1:8085

Include macros/*.conf
IncludeOptional sites-enabled/*.conf
