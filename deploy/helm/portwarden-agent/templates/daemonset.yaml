apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "portwarden-agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portwarden-agent.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "portwarden-agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portwarden-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "portwarden-agent.selector" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "portwarden-agent.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "portwarden-agent.name" . }}
      automountServiceAccountToken: false
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --nats-url={{ .Values.nats.url }}
            {{- if eq .Values.nats.credentialType "creds" }}
            - --nats-creds=/etc/portwarden/nats/{{ .Values.nats.credentialKey }}
            {{- else if eq .Values.nats.credentialType "nkey" }}
            - --nats-nkey=/etc/portwarden/nats/{{ .Values.nats.credentialKey }}
            {{- else }}
            {{- fail "nats.credentialType must be nkey or creds" }}
            {{- end }}
            {{- if .Values.nats.caSecret }}
            - --tls-ca=/etc/portwarden/nats-ca/{{ .Values.nats.caKey }}
            {{- end }}
            - --spool-dir=/var/lib/portwarden/spool
            - --machine-id-path=/etc/machine-id
            - --heartbeat={{ .Values.agent.heartbeat }}
            - --tamper-interval={{ .Values.agent.tamperInterval }}
            - --proxy-map={{ .Values.agent.proxyMap }}
            - --imds={{ .Values.agent.imds }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "PERFMON", "SYS_PTRACE", "NET_ADMIN"]
            seccompProfile:
              type: {{ .Values.seccompProfile }}
            appArmorProfile:
              type: Unconfined
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
            - name: spool
              mountPath: /var/lib/portwarden
            - name: tmp
              mountPath: /tmp
            - name: nats
              mountPath: /etc/portwarden/nats
              readOnly: true
            {{- if .Values.nats.caSecret }}
            - name: nats-ca
              mountPath: /etc/portwarden/nats-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        - name: dbus
          hostPath:
            path: /run/dbus
            type: DirectoryOrCreate
        - name: spool
          hostPath:
            path: {{ .Values.spoolHostPath }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nats
          secret:
            secretName: {{ .Values.nats.existingSecret }}
            defaultMode: 0400
        {{- if .Values.nats.caSecret }}
        - name: nats-ca
          secret:
            secretName: {{ .Values.nats.caSecret }}
            defaultMode: 0444
        {{- end }}
