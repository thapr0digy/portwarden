# Least-privilege NATS auth for Listener Watch. Replace HOST_ID with the host's
# /etc/machine-id and the passwords with bcrypt hashes (`nats server passwd`).
# Everything is in the global account, with JetStream on.
listen: 127.0.0.1:4222
jetstream { store_dir: "/var/lib/nats" }

authorization {
  users = [
    # Admin: creates and manages the stream. NOTE: "$JS.API.>" is admin-level (it can
    # delete or purge ASM_EVENTS, wiping every host's data); never give it to a host.
    {
      user: "admin"
      password: "ADMIN_PASSWORD"
      permissions: {
        publish: { allow: ["$JS.API.>", "asm.>"] }
        subscribe: { allow: ["_INBOX.>", "asm.>", "$JS.API.>"] }
      }
    }
    # One per host: may publish only its own subjects. It cannot look up, create,
    # update, purge or delete the stream, or create consumers. The agent keeps
    # publishing when its stream lookup is refused, so the stream must already exist.
    # The agent's reply inboxes (JetStream publish acks) are _INBOX_<host-id>.<id>, so
    # the host may subscribe only to its own. Never allow "_INBOX.>": JetStream
    # consumers receive message payloads on _INBOX.<id>, so it would let one host read
    # every consumer's deliveries.
    {
      user: "host-HOST_ID"
      password: "HOST_PASSWORD"
      permissions: {
        publish: { allow: ["asm.HOST_ID.>"] }
        subscribe: { allow: ["_INBOX_HOST_ID.>"] }
      }
    }
  ]
}

# Create the stream once, as admin. The agent never changes an existing stream, so the
# retention, replicas and limits here are the operator's; this is the agent's default:
#   nats --user admin --password ADMIN_PASSWORD stream add ASM_EVENTS \
#     --subjects 'asm.>' --storage file --retention limits --max-age 168h \
#     --dupe-window 2m --replicas 1 --defaults
# Agent: --nats-url nats://host-HOST_ID:HOST_PASSWORD@nats.example:4222 (or --nats-creds
# with an operator-mode account; the same publish-only permissions apply).
